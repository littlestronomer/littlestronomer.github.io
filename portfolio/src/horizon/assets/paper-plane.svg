       left like the painting. It replaces the little plane painted into the clouds. -->
  <defs>
    <linearGradient id="near-wing" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e9eef4" />
    </linearGradient>
    <linearGradient id="keel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3dce6" />
      <stop offset="1" stop-color="#aebdce" />
    </linearGradient>
  </defs>
  <polygon points="6,12 116,32 4,18" fill="#dbe3ec" />
  <polygon points="4,18 116,32 18,30" fill="url(#near-wing)" />
  <polygon points="18,30 116,32 34,44" fill="url(#keel)" />
  <path d="M18 30 116 32" fill="none" stroke="#5a6f8c" stroke-opacity="0.45" stroke-width="0.8" />
  <path d="M5 17.6 115 31.4" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.7" />
  <path d="M4 18 6 12 116 32 34 44 18 30Z" fill="none" stroke="#6b7f9c" stroke-opacity="0.6" stroke-width="0.9" stroke-linejoin="round" />
</svg>
